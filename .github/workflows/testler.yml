# Her gönderimde (push) ve birleştirme isteğinde (pull request) Kolay Linux ve Windows'ta derlenir ve bütün
# testler çalışır: yorumlayıcı, LLVM derleyicisi (iki yolun aynı çıktıyı vermesi), hata mesajları, dahil et,
# etkileşimli kip.
name: Testler

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerekenler (clang, llvm-link, libffi)
        run: sudo apt-get update && sudo apt-get install -y clang llvm libffi-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Derle
        run: cargo build --release

      - name: Testler
        run: ./testler/calistir.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # clang (LLVM) ve MSVC araçları Windows sanal makinesinde hazır gelir
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Derle
        run: cargo build --release

      - name: Testler
        shell: bash
        # başarısız testlerin çıktısı iş özetinde (annotation) de görünür
        run: |
          ./testler/calistir.sh > sonuc.txt 2>&1 && kod=0 || kod=$?
          cat sonuc.txt
          if [ $kod != 0 ]; then
            echo "::error title=Windows testleri::$(head -c 30000 sonuc.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $kod
