[package]
name = "kolay"
version = "0.7.0"
edition = "2024"
description = "Kolay: Türkçe, tip güvenli ve hızlı bir programlama dili"
authors = ["Ömer Faruk Yılmaz <ofy.omer.yilmaz@gmail.com>"]
license-file = "LICENSE"

[dependencies]
half = "2.7.1"
indexmap = "2.14.2"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
rustyline = { version = "14", default-features = false, features = ["with-file-history", "custom-bindings"] }

# Windows'ta sistemde libffi olmadığı için kaynağından derlenir (Linux'ta sistemin libffi'si kullanılır).
[target.'cfg(windows)'.dependencies]
libffi-sys = "2.3"
